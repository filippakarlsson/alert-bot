name: Refresh Trend Dashboard

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendbot-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate fresh snapshot
        env:
          DASHBOARD_ENABLED: "false"
          DASHBOARD_SNAPSHOT_PATH: "public/gratisversion/index.html"
          TRENDBOT_DB_PATH: "data/trendbot.sqlite3"
          SWEDISH_ONLY_MODE: "true"
          REDDIT_ENABLED: "false"
          ENABLE_SOURCE_GOOGLE_GLOBAL: "false"
          ENABLE_SOURCE_BBC: "false"
          ENABLE_SOURCE_NPR: "false"
          ENABLE_SOURCE_AP: "false"
          ENABLE_SOURCE_VARIETY: "false"
          ENABLE_SOURCE_BILLBOARD: "false"
          ENABLE_SOURCE_THE_VERGE: "false"
          ENABLE_SOURCE_PEOPLE: "false"
          ENABLE_SOURCE_EONLINE: "false"
          ENABLE_SOURCE_TMZ: "false"
          ENABLE_SOURCE_ROLLINGSTONE: "false"
          POLL_INTERVAL_SECONDS: "300"
          RSS_REFRESH_SECONDS: "300"
          GOOGLE_NEWS_RECENCY_QUERY: "when:2d"
          TRENDBOT_TOPICS_ACTIVE: "nöje,musik,politik,nyheter,film,tv,kändisar,k-pop,eurovision,tiktok,influencer,streamers,youtube,memes,virala trender,internetkultur,skaparekonomi,viralt klipp,spel,poddar,streaming,mode,sport,reality tv,paradise hotel,förrädarna,ex on the beach,love island,bachelor"
        run: |
          mkdir -p public/gratisversion data
          python3 main.py once

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "trendbot-bot"
          git config user.email "trendbot-bot@users.noreply.github.com"
          git add public/gratisversion/index.html data/trendbot.sqlite3
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh dashboard snapshot [skip ci]"
          if git push origin HEAD:main; then
            echo "Snapshot push succeeded."
            exit 0
          fi

          echo "Initial push failed, retrying with fetch/rebase..."
          git fetch origin main
          if git rebase origin/main; then
            if git push origin HEAD:main; then
              echo "Snapshot push succeeded after rebase."
              exit 0
            fi
          fi

          echo "::warning::Snapshot commit was created locally in runner but push failed after retry; marking job successful to avoid noisy false-negative."
          exit 0
